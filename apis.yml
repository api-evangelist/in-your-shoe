name: In Your Shoe
description: In Your Shoe is an Egyptian streetwear and apparel brand, founded in 2018
  and based in Cairo, Egypt, that designs and sells playful, statement-driven ready-to-wear
  pieces — oversized and boxy tees, shirts, jeans, jorts, loungewear, kids' lines, and
  accessories — letting Millennials and Gen-Z express themselves through high-quality,
  self-expressive fashion. The company sells direct-to-consumer through a Shopify storefront
  and is backed by 500 Global and the Misk 500 MENA Accelerator. It publishes no first-party
  developer API, SDK, or documentation surface; this profile captures its identity and public
  web properties for the API Evangelist network.
